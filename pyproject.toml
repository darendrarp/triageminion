[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triageminion"
version = "0.1.0"
description = "GitHub issue triage agent built on the OpenMinion 0.1 Python SDK (Cortensor Hackathon #5)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openminion==0.1.22",
    "pydantic>=2.0",
]

[project.scripts]
triageminion = "triageminion.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
